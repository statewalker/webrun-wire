<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>mounts relay</title>
  </head>
  <body>
    <script type="module">
      // The shipped public-relay/relay.html, pointed at this directory's own
      // worker (which sets RELAY_OPTIONS before loading the bundle) and scoped
      // to this directory, so the mounts are relative to it.
      import { getRelayWindowMessageHandler } from "/dist/index.js";

      window.onmessage = getRelayWindowMessageHandler({
        swUrl: `${new URL("./relay-sw.js", import.meta.url)}`,
        scopeUrl: `${new URL("./", import.meta.url)}`,
      });
    </script>
  </body>
</html>
